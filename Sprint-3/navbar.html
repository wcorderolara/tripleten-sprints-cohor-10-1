<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-size: 16px;
            margin: 0;
            padding: auto;
            box-sizing: border-box;
        }

        header {
            background-color: #dadada;
            display: grid;
            padding: 20px 10px;
            grid-template-columns: 150px 1fr;
            align-items: center;
        }

        .logo,.stack-menu {
            display: flex;
            align-items: center;
        }

        .logo {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stack-menu {
            justify-content: end;
        }

        .navigation {
            display: none;
        }

        .nav-link {
            text-decoration: none;
            color: #333;
            font-size: 1.25rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        @media (min-width: 768px) {
            .stack-menu {
                display: none;
            }

            .navigation {
                display: block;
            }

            .nav-menu {
                display: flex;
                list-style: none;
                gap: 20px;
                justify-content: end;
                align-items: center;
            }
        }

        @media (min-width: 1024px) {
            header {
                padding: 32px 48px;
            }

            .nav-link {
                font-size: 1.5rem;
                color: blue;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Logo</div>
        <figure class="stack-menu">
            <img src="assets/images/stack.png" alt="Stack Image" width="25">
        </figure>
        <nav class="navigation">
            <ul class="nav-menu">
                <li><a class="nav-link" href="#">Home</a></li>
                <li><a class="nav-link" href="#">About</a></li>
                <li><a class="nav-link" href="#">Services</a></li>
                <li><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    
</body>
</html>
